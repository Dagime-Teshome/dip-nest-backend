# prettier-ignore

apiVersion: batch/v1
kind: Job
metadata:
  name: migration-job-{{.Values.backend.imageTag}}
spec:
  ttlsecondsAfterFinished: 10
  template:
    spec:
      containers:
        - name: migration-job
          image: "{{ .Values.backend.image }}:{{.Values.backend.imageTag}}"
          env:
            - name: DB_HOST
              value: {{ .Values.database.host }}
            - name: DB_USERNAME
              value: {{ .Values.database.username }}
            - name: DB_PASSWORD
              value: "{{ .Values.database.password }}"
            - name: ENVIRONMENT
              value: {{ .Values.database.environment }}
          command: ["npm", "run", "migration:run"]
      restartPolicy: Never
  backoffLimit: 4
