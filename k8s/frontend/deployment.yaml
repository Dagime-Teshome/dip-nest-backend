apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend-deployment
  labels:
    app: todo
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo
      tier: frontend
  template:
    metadata:
      labels:
        app: todo
        tier: frontend
    spec:
      containers:
        - name: todo-frontend
          image: 731733338253.dkr.ecr.eu-north-1.amazonaws.com/dip-front-end-ecr:latest
          ports:
            - containerPort: 80
